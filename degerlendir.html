<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ürünü Değerlendir | Gamika</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo.png">
<style>
:root{--bg:#FFF9FB;--tx:#2A1B2E;--mu:#A67B9B;--pk:#E0709A;--ac:#9B4DE0;--bd:#F3EAFE;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#F3EAFE,#FDEBF3 50%,#FFF9FB);min-height:100vh;color:var(--tx);font:16px/1.6 system-ui,Segoe UI,Arial,sans-serif}
header{padding:18px;text-align:center}header img{height:44px}
main{max-width:640px;margin:0 auto;padding:8px 16px 48px}
h1{font-size:26px;margin:.2em 0;text-align:center}.mu{color:var(--mu);font-size:14px;text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin:16px 0;box-shadow:0 8px 24px rgba(155,77,224,.08)}
.prod{display:flex;gap:14px;align-items:center}.prod img{width:72px;height:72px;border-radius:14px;object-fit:cover;background:#FDEBF3}
.prod b{font-size:15px}
.stars{display:flex;gap:6px;margin:14px 0 6px}.stars button{background:none;border:0;font-size:32px;line-height:1;cursor:pointer;color:#E5D9E8;padding:0}
.stars button.on{color:#F5B301}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,textarea{width:100%;padding:11px 12px;border:1px solid #F3D3E3;border-radius:12px;font:inherit;font-size:14px;background:#FFF9FB}
textarea{min-height:90px;resize:vertical}
.btn{margin-top:12px;width:100%;padding:13px;border:0;border-radius:14px;background:var(--tx);color:#fff;font-weight:700;letter-spacing:.04em;cursor:pointer}
.btn:disabled{opacity:.5}
.ok{color:#047857;font-weight:600;margin-top:10px}.err{color:#dc2626;font-size:14px;margin-top:8px}
.done{color:#047857;font-weight:600;font-size:14px;margin-top:8px}
a{color:var(--ac)}
</style></head><body>
<header><a href="/"><img src="/logo.webp" alt="Gamika"></a></header>
<main>
  <h1>Ürününü değerlendir ⭐</h1>
  <p class="mu" id="hello">Yükleniyor...</p>
  <div id="list"></div>
  <p class="mu" style="margin-top:24px"><a href="/">Gamika'ya dön</a></p>
</main>
<script>
const SUPABASE_URL = 'https://yhgdnpomcfosobqluafi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GvrjJ4s2GB1wF7e8IYKM1Q_7gLslFhY';
const token = new URLSearchParams(location.search).get('t') || '';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
async function rpc(fn, body){
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => null);
  if(!r.ok) throw new Error((d && d.message) || 'Bir hata oluştu');
  return d;
}
const rating = {};
function stars(pid){
  return [1,2,3,4,5].map(n => `<button type="button" aria-label="${n} yıldız" onclick="setR(${pid},${n})" class="${(rating[pid]||0) >= n ? 'on' : ''}">★</button>`).join('');
}
function setR(pid, n){ rating[pid] = n; document.getElementById('s' + pid).innerHTML = stars(pid); }
async function send(pid){
  const btn = document.getElementById('b' + pid), er = document.getElementById('e' + pid);
  er.textContent = '';
  if(!rating[pid]){ er.textContent = 'Lütfen yıldız seç.'; return; }
  btn.disabled = true; btn.textContent = 'Gönderiliyor...';
  try{
    await rpc('submit_review', { p_token: token, p_product_id: pid, p_rating: rating[pid],
      p_name: document.getElementById('n' + pid).value, p_comment: document.getElementById('c' + pid).value || null });
    document.getElementById('f' + pid).innerHTML = '<p class="ok">Teşekkürler! Yorumun yayınlandı 💖</p>';
  }catch(e){ er.textContent = e.message; btn.disabled = false; btn.textContent = 'GÖNDER'; }
}
(async () => {
  if(!/^[0-9a-f-]{36}$/i.test(token)){ document.getElementById('hello').textContent = 'Bağlantı geçersiz. Lütfen mailindeki bağlantıyı kullan.'; return; }
  try{
    const d = await rpc('review_order', { p_token: token });
    document.getElementById('hello').textContent = 'Merhaba ' + d.name + '! Aldığın ürünleri nasıl buldun?';
    document.getElementById('list').innerHTML = d.items.map(it => `
      <div class="card">
        <div class="prod">${it.img ? `<img src="${esc(it.img)}" alt="">` : ''}<b>${esc(it.name)}</b></div>
        <div id="f${it.product_id}">${it.done ? '<p class="done">✓ Bu ürünü değerlendirdin, teşekkürler!</p>' : `
          <div class="stars" id="s${it.product_id}">${stars(it.product_id)}</div>
          <label>Adın <span style="font-weight:400;color:#A67B9B">(isteğe bağlı)</span></label><input id="n${it.product_id}" maxlength="40" placeholder="Boş bırakırsan Gizemli Oyuncu olarak görünürsün" value="${esc(d.name)}">
          <label>Yorumun <span style="font-weight:400;color:#A67B9B">(isteğe bağlı)</span></label><textarea id="c${it.product_id}" maxlength="600" placeholder="Kalitesi, renkleri, kargo..."></textarea>
          <p class="err" id="e${it.product_id}"></p>
          <button class="btn" id="b${it.product_id}" onclick="send(${it.product_id})">GÖNDER</button>`}</div>
      </div>`).join('');
  }catch(e){ document.getElementById('hello').textContent = e.message; }
})();
</script>
</body></html>
