<!doctype html>
<html lang="tr">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gamika Yönetim</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#0d0b14;--side:#100d19;--card:#15121f;--bd:#262234;--tx:#ece9f5;--mu:#8e89a3;--ac:#c084fc;--pk:#f472b6;--ok:#4ade80;--er:#f87171;--wa:#fbbf24;--bl:#818cf8}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);
 background-image:radial-gradient(800px 500px at 100% 0,#f472b61f,transparent 60%),radial-gradient(700px 500px at 100% 100%,#c084fc1c,transparent 60%);background-attachment:fixed}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:linear-gradient(135deg,var(--pk),var(--ac));border:0;color:#1a0d24;font-weight:600}
button.sm{padding:4px 9px;font-size:13px}
input,select{background:#0f0c18;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus{outline:0;border-color:var(--ac)}
.shell{display:flex;min-height:100vh}
aside{width:190px;flex:none;background:var(--side);border-right:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.brand{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--pk),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--mu);-webkit-text-fill-color:var(--mu)}
nav{margin-top:22px;display:flex;flex-direction:column;gap:4px;flex:none}
.sideimg{position:absolute;inset:0;z-index:0;background-repeat:no-repeat;background-position:center;background-size:cover}
aside>*:not(.sideimg){position:relative;z-index:1}
aside .out{margin-top:auto}
nav button,.brand{text-shadow:0 1px 6px #000}
.bgimg{position:fixed;top:0;right:0;bottom:0;width:58%;background-size:cover;background-position:center top;opacity:.55;z-index:0;pointer-events:none;
 -webkit-mask-image:linear-gradient(to right,transparent,#000 55%);mask-image:linear-gradient(to right,transparent,#000 55%)}
main,aside{position:relative;z-index:1}
nav button{text-align:left;background:transparent;border:0;display:flex;justify-content:space-between;align-items:center;padding:9px 10px;color:var(--mu)}
nav button.on{background:#c084fc22;color:var(--tx)}
nav .bd{background:var(--pk);color:#1a0d24;border-radius:99px;font-size:11px;font-weight:700;padding:0 7px}
.out{background:transparent;border:0;color:var(--mu);text-align:left}
main{flex:1;min-width:0;max-width:900px;padding:24px}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
h2{margin:0;font-size:22px}
.kpi{display:flex;gap:28px;text-align:right}.kpi .l{font-size:11px;color:var(--mu)}.kpi .v{font-size:20px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border:1px solid var(--bd);border-radius:12px;background:var(--card);margin-bottom:14px;overflow:hidden}
.stats div{padding:12px 14px;border-right:1px solid var(--bd)}.stats div:last-child{border:0}
.stats .l{font-size:12px;color:var(--mu)}.stats .n{font-size:22px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.chip{border-radius:99px;padding:3px 12px;font-size:13px;background:transparent}
.chip.on{border-color:var(--ac);background:#c084fc22}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:10px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--mu);font-weight:500}
td.r,th.r{text-align:right}
tr.cl{cursor:pointer}tr.cl:hover td{background:#ffffff06}
.mu{color:var(--mu);font-size:12px}.b{font-weight:600}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;background:#ffffff10;white-space:nowrap}
.pill::before{content:"● ";font-size:9px}
.s_odeme_bekleniyor{color:var(--wa)}.s_odendi,.s_hazirlaniyor{color:var(--bl)}.s_kargoda{color:var(--ac)}.s_teslim_edildi{color:var(--ok)}.s_iptal{color:var(--er)}
.ok{color:var(--ok)}.er{color:var(--er)}.wa{color:var(--wa)}
.pics{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.pic{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--bd)}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .k{position:absolute;left:4px;top:4px;background:#2A1B2E;color:#fff;font-size:10px;padding:1px 6px;border-radius:6px}
.pic .bt{position:absolute;bottom:3px;left:3px;right:3px;display:flex;justify-content:space-between}
.pic .bt button{padding:0 6px;font-size:12px;line-height:20px;min-height:0;border-radius:6px;background:rgba(255,255,255,.9)}
.vt{width:auto!important;min-width:0!important}.vt td{padding:3px 3px!important;border:0!important;white-space:nowrap}.vt input{margin:0}
.thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;background:var(--bd);display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.det td{background:#0f0c18}
.dlg-x{position:sticky;top:0;float:right;z-index:5;width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;line-height:1;cursor:pointer;margin:-6px -6px 0 8px;padding:0}.dlg-x:hover{background:var(--bd)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:#000a}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
#msg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;display:none;font-size:14px;z-index:9}
.login{max-width:340px;margin:12vh auto;padding:20px;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.login h1{margin:0 0 4px}
@media(max-width:760px){
 .shell{flex-direction:column}
 aside{width:auto;height:auto;position:static;flex-direction:row;align-items:center;gap:8px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--bd);overflow-x:auto}
 .brand small{display:none}
 nav{flex-direction:row;margin:0;flex:none}
 main{padding:14px}
 .bgimg{width:100%;opacity:.18;-webkit-mask-image:none;mask-image:none}
 .sideimg{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="msg"></div>
<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://yhgdnpomcfosobqluafi.supabase.co','sb_publishable_GvrjJ4s2GB1wF7e8IYKM1Q_7gLslFhY');
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={odeme_bekleniyor:'Ödeme bekleniyor',odendi:'Ödendi',hazirlaniyor:'Hazırlanıyor',kargoda:'Kargoda',teslim_edildi:'Teslim edildi',iptal:'İptal'};
const CAT=['mousepad','figur','bilek','switch'];
const TITLE={orders:'Siparişler',products:'Ürünler',sets:'Setler'};
const ico=i=>{i=String(i||'').trim();if(!i)return '📦';if(i.includes('fa-'))return `<i class="${i.includes(' ')?esc(i):'fa-solid '+esc(i)}"></i>`;return esc(i)};
const tl=n=>Number(n||0).toLocaleString('tr-TR',{style:'currency',currency:'TRY'});
const dt=d=>new Date(d).toLocaleString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
let tab='orders',fil='',D={orders:[],products:[],sets:[]};

function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2200)}

function loginView(err){
  $('#app').innerHTML=`<div class="login"><h1 class="brand">Gamika Yönetim</h1>
  <label>E-posta</label><input id="em" type="email" autocomplete="username">
  <label>Şifre</label><input id="pw" type="password" autocomplete="current-password">
  <div id="cf" style="margin-top:12px"></div>
  <p class="er">${esc(err||'')}</p>
  <button class="pri" style="width:100%" onclick="login()">Giriş yap</button></div>`;
  $('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
  renderTs();
}
const TS_KEY='0x4AAAAAAGIC8Lut-K4TDwKW';let tsToken='';
function onTs(){renderTs()}
function renderTs(){
  if(!window.turnstile||!$('#cf'))return;
  tsToken='';
  turnstile.render('#cf',{sitekey:TS_KEY,callback:t=>{tsToken=t},'expired-callback':()=>{tsToken=''},'error-callback':()=>{tsToken=''}});
}
async function login(){
  if(!tsToken)return toast('Önce doğrulama kutusunu tamamla');
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value,options:{captchaToken:tsToken}});
  if(error)return loginView('Giriş başarısız: '+error.message);
  boot();
}
async function logout(){await sb.auth.signOut();loginView()}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return loginView();
  const {data:ok}=await sb.rpc('is_admin');
  if(!ok){
    $('#app').innerHTML=`<div class="login"><p class="er b">Bu hesabın yönetici yetkisi yok.</p><button onclick="logout()">Çıkış</button></div>`;
    return;
  }
  await load();
}
async function load(){
  const [o,p,s]=await Promise.all([
    sb.from('orders').select('*').order('created_at',{ascending:false}).limit(200),
    sb.from('products').select('*').order('id'),
    sb.from('sets').select('*').order('id')]);
  const e=o.error||p.error||s.error;
  if(e)toast('Hata: '+e.message);
  D.orders=o.data||[];D.products=p.data||[];D.sets=s.data||[];
  render();
}

function render(){
  const open=D.orders.filter(x=>['odendi','hazirlaniyor'].includes(x.status)).length;
  const wait=D.orders.filter(x=>x.status==='odeme_bekleniyor').length;
  const ship=D.orders.filter(x=>x.status==='kargoda').length;
  const done=D.orders.filter(x=>x.status==='teslim_edildi').length;
  const rev=D.orders.filter(x=>!['iptal','odeme_bekleniyor'].includes(x.status)).reduce((a,x)=>a+Number(x.total||0),0);
  const low=D.products.filter(x=>x.is_active&&x.stock<=3).length;
  const N=(k)=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()"><span>${TITLE[k]}</span>${k==='orders'&&(wait+open)?`<span class="bd">${wait+open}</span>`:''}</button>`;
  $('#app').innerHTML=`<div class="shell"><div class="bgimg" style="background-image:url(img/bg-${tab}.jpg);background-position:center ${({orders:'20%',products:'20%',sets:'85%'})[tab]}"></div>
    <aside><div class="sideimg" style="background-image:linear-gradient(#100d19e6 0,#100d1980 45%,#100d1999 100%),url(img/side-${tab}.jpg)"></div>
      <div class="brand">Gamika<small>Yönetim</small></div>
      <nav>${N('orders')}${N('products')}${N('sets')}</nav>
      <button class="out" onclick="logout()">Çıkış</button></aside>
    <main><div class="top"><h2>${TITLE[tab]}</h2>
      <div class="kpi"><div><div class="l">Ciro (iptal hariç, ödenen)</div><div class="v">${tl(rev)}</div></div>
      <div><div class="l">Düşük stok (3 ve altı)</div><div class="v ${low?'wa':''}">${low} ürün</div></div></div></div>
      ${tab==='orders'?`<div class="stats">
        <div><div class="l">Ödeme bekliyor</div><div class="n">${wait}</div></div>
        <div><div class="l">Hazırlanacak</div><div class="n">${open}</div></div>
        <div><div class="l">Kargoda</div><div class="n">${ship}</div></div>
        <div><div class="l">Teslim edildi</div><div class="n">${done}</div></div></div>`:''}
      <div id="view"></div></main></div>`;
  ({orders:vOrders,products:vProducts,sets:vSets})[tab]();
}

function vOrders(){
  const list=D.orders.filter(x=>!fil||x.status===fil);
  const chip=(k,l)=>`<button class="chip ${fil===k?'on':''}" onclick="fil='${k}';vOrders()">${l}</button>`;
  $('#view').innerHTML=`<div class="chips"><span class="mu">${list.length} sipariş</span>${chip('','Tümü')}${Object.entries(ST).map(([k,v])=>chip(k,v)).join('')}</div>
  <div class="card tbl"><table><tr><th>Sipariş</th><th>Müşteri</th><th>Tarih</th><th>Durum</th><th class="r">Tutar</th></tr>
  ${list.map(o=>{
    const items=Array.isArray(o.items)?o.items:[];
    return `<tr class="cl" onclick="tg(${o.id})"><td class="b">${esc(o.order_no)}</td>
      <td>${esc(o.customer_name)}<div class="mu">${esc(o.city)}</div></td><td class="mu">${dt(o.created_at)}</td>
      <td><span class="pill s_${o.status}">${ST[o.status]||esc(o.status)}</span></td><td class="r b">${tl(o.total)}</td></tr>
      <tr class="det" id="d${o.id}" style="display:none"><td colspan="5">
        <div class="row"><span class="mu">Tel: ${esc(o.phone)} · ${esc(o.email)}</span>
        <select style="width:auto" onchange="setStatus(${o.id},this.value)">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></div>
        <p class="mu">Adres: ${esc(o.address)}, ${esc(o.city)}${o.note?`<br>Not: ${esc(o.note)}`:''}</p>
        <ul>${items.map(i=>`<li>${esc(i.name||i.title||i.product_name||'Ürün')} × ${esc(i.qty||i.quantity||1)}${i.price?' · '+tl(i.price):''}</li>`).join('')||`<li class="mu">${esc(JSON.stringify(o.items))}</li>`}</ul></td></tr>`;
  }).join('')||'<tr><td colspan="5" class="mu">Sipariş yok.</td></tr>'}</table></div>`;
}
function tg(id){const e=$('#d'+id);e.style.display=e.style.display==='none'?'table-row':'none'}
async function setStatus(id,v){
  const {error}=await sb.rpc('admin_set_order_status',{p_order_id:id,p_status:v});
  if(error){toast('Hata: '+error.message);return load()}
  D.orders.find(o=>o.id===id).status=v;toast('Durum güncellendi');render();
}

function vProducts(){
  const sorted=[...D.products].sort((a,b)=>a.stock-b.stock);
  $('#view').innerHTML=`<div class="row" style="margin-bottom:10px"><span class="mu">${D.products.length} ürün, stoku en az olan üstte</span>
    <button class="pri" onclick="editP()">+ Yeni ürün</button></div>
    <div class="card tbl"><table><tr><th></th><th>Ürün</th><th>Kategori</th><th>Stok</th><th>Fiyat</th><th>Durum</th><th></th></tr>
    ${sorted.map(p=>`<tr><td>${(p.image_url||p.google_image)?`<img class="thumb" src="${esc(p.image_url||p.google_image)}" alt="">`:`<span class="thumb">${ico(p.icon)}</span>`}</td>
    <td><span class="b">${esc(p.name)}</span><div class="mu">${esc(p.type_label)}</div></td><td class="mu">${esc(p.category)}</td>
    <td>${p.stock<=3?`<span class="pill wa">${p.stock} adet kaldı</span>`:`${p.stock} adet`}</td><td>${tl(p.price)}</td>
    <td><button class="sm" onclick="togP(${p.id})"><span class="${p.is_active?'ok':'er'}">${p.is_active?'Aktif':'Pasif'}</span></button></td>
    <td><button class="sm" onclick="editP(${p.id})">Düzenle</button></td></tr>`).join('')}</table></div>`;
}
async function togP(id){
  const p=D.products.find(x=>x.id===id);
  const {error}=await sb.from('products').update({is_active:!p.is_active}).eq('id',id);
  if(error)return toast('Hata: '+error.message);
  p.is_active=!p.is_active;render();
}
async function editP(id){
  VARS=[];VDEL=[];
  if(id){const {data,error}=await sb.from('product_variants').select('*').eq('product_id',id).order('sort').order('id');if(error)return toast('Seçenekler yüklenemedi: '+error.message);VARS=(data||[]).map(v=>({...v,price:v.price==null?'':v.price}));}
  const p=D.products.find(x=>x.id===id)||{category:'mousepad',stock:10,is_active:true,price:0,option2_label:'Ölçü'};
  $('#dlg').innerHTML=`<button class="dlg-x" onclick="$('#dlg').close()" title="Kapat" aria-label="Kapat">✕</button><h3 style="margin-top:0">${id?'Ürünü düzenle':'Yeni ürün'}</h3>
  <label>Ad</label><input id="f_name" value="${esc(p.name)}">
  <label>Kategori</label><select id="f_cat" onchange="catMode()">${CAT.map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select>
  <label>Tür etiketi</label><input id="f_type" value="${esc(p.type_label)}">
  <label>Seri</label><select id="f_series">${[['','Seri yok'],['dark','Dark'],['minimal','Minimal'],['candy','Candy']].map(([v,t])=>`<option value="${v}" ${(p.series||'')===v?'selected':''}>${t}</option>`).join('')}</select>
  <div id="f_sizes" class="card" style="padding:12px;margin:12px 0;background:var(--bg,#fafafa)"></div>
  <div id="f_ps" class="row"><div style="flex:1"><label>Fiyat (₺)</label><input id="f_price" type="number" min="0" step="0.01" value="${p.price}"></div>
  <div style="flex:1"><label>Stok</label><input id="f_stock" type="number" min="0" step="1" value="${p.stock}"></div></div>
  <div id="f_varbox" class="card" style="padding:12px;margin:12px 0;background:var(--bg,#fafafa)">
    <div class="b" style="margin-bottom:4px">Seçenekler (renk, ölçü vb.)</div>
    <div class="mu" style="margin-bottom:8px">Seçenek eklersen müşteri ürün sayfasında seçim yapar. Her seçeneğin kendi fiyatı, stoğu ve fotoğrafı olabilir. Fiyatı boş bırakırsan yukarıdaki fiyat kullanılır. Seçenek varsa yukarıdaki stok yerine seçeneklerin stoğu geçerli olur.</div>
    <div class="row" style="gap:8px"><div style="flex:1"><label>1. seçenek adı</label><input id="f_o1" placeholder="Renk" value="${esc(p.option_label||'')}"></div>
      <div style="flex:1"><label>2. seçenek adı (isteğe bağlı)</label><input id="f_o2" placeholder="Ölçü" value="${esc(p.option2_label||'')}" oninput="drawVar()"></div></div>
    <details style="margin:8px 0" ${VARS.length?'':'open'}><summary class="mu" style="cursor:pointer">⚡ Hızlı oluştur: değerleri virgülle yaz, tüm birleşimler eklensin</summary>
      <div class="mu" style="margin:6px 0 2px">Mousepad ölçüleri hazır yazılı (90x40, 70x30); istemediğini silebilirsin.</div>
      <div class="row" style="gap:8px;margin-top:6px"><input id="g1" placeholder="Pembe, Lila, Mor" style="flex:1"><input id="g2" placeholder="90x40, 70x30" value="${p.category==='mousepad'?'90x40, 70x30':''}" style="flex:1"><button class="sm" onclick="genVar()">Oluştur</button></div></details>
    <datalist id="olculer"><option value="90x40"><option value="70x30"></datalist>
    <div id="vars"></div>
    <button class="sm" style="margin-top:6px" onclick="VARS.push({name:'',opt2:'',price:'',stock:0,images:[],is_active:true});drawVar()">+ Seçenek ekle</button>
  </div>
  <label>Açıklama (ürün sayfasında ve Google'da görünür)</label><textarea id="f_desc" rows="4" style="width:100%;font:inherit;padding:8px;border-radius:8px;box-sizing:border-box" placeholder="Örn: 90x40 cm geniş, kaymaz tabanlı, dikişli kenar...">${esc(p.description||'')}</textarea>
  <label>Beyaz görsel (Google)</label>
  <div class="mu" style="margin-bottom:6px">Beyaz arka planlı fotoğraf. Google ve Google Alışveriş bu fotoğrafı gösterir.</div>
  <div id="gpic" class="pics"></div>
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <label class="sm" style="display:inline-block;cursor:pointer;border:1px solid var(--bd);padding:6px 12px;border-radius:8px;margin:0">📷 Beyaz görsel yükle<input id="f_gfile" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" style="display:none" onchange="upGPic(this.files)"></label>
    <span id="gupst" class="mu"></span>
  </div>
  <label style="margin-top:12px">Vitrin görseli (seri) ve diğer fotoğraflar</label>
  <div class="mu" style="margin-bottom:6px">İlk fotoğraf sitede kapak olur: buraya önce Dark / Minimal / Candy görselini yükle. En fazla 10 fotoğraf.</div>
  <div id="pics" class="pics"></div>
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <label class="sm" style="display:inline-block;cursor:pointer;border:1px solid var(--bd);padding:6px 12px;border-radius:8px;margin:0">📷 Fotoğraf yükle<input id="f_files" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" multiple style="display:none" onchange="upPics(this.files)"></label>
    <span id="upst" class="mu"></span>
  </div>
  <label style="margin-top:12px">Videolar (en fazla 3, her biri en fazla 50 MB; 15-30 saniyelik dikey videolar en iyisi)</label>
  <div id="vids" class="pics"></div>
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <label class="sm" style="display:inline-block;cursor:pointer;border:1px solid var(--bd);padding:6px 12px;border-radius:8px;margin:0">🎬 Video yükle<input id="f_vfiles" type="file" accept="video/mp4,video/webm,video/quicktime" multiple style="display:none" onchange="upVids(this.files)"></label>
    <span id="vupst" class="mu"></span>
  </div>
  <details style="margin-top:6px"><summary class="mu" style="cursor:pointer">veya internet adresiyle (URL) fotoğraf ekle</summary>
    <div class="row" style="gap:6px"><input id="f_url" placeholder="https://..."><button class="sm" onclick="addUrl()">Ekle</button></div></details>
  <label>İkon (emoji)</label><input id="f_icon" value="${esc(p.icon)}">
  <label><input id="f_act" type="checkbox" style="width:auto" ${p.is_active?'checked':''}> Aktif (mağazada görünsün)</label>
  <div class="row" style="margin-top:16px"><button onclick="$('#dlg').close()">Vazgeç</button><button class="pri" onclick="saveP(${id||0})">Kaydet</button></div>`;
  IMGS=[...new Set([...(Array.isArray(p.images)?p.images:[]),p.image_url].filter(u=>typeof u==='string'&&u.startsWith('https://')))];
  drawPics();
  GIMG=typeof p.google_image==='string'&&p.google_image.startsWith('https://')?p.google_image:'';drawGPic();
  VIDS=(Array.isArray(p.videos)?p.videos:[]).filter(u=>typeof u==='string'&&u.startsWith('https://'));
  drawVids();
  drawVar();
  if(!id&&p.category==='mousepad'&&!VARS.length)VARS.push({name:SIZES[0],opt2:'',price:'',stock:10,images:[],is_active:true});
  catMode();
  $('#dlg').showModal();
}
let IMGS=[],VIDS=[],VARS=[],VDEL=[],GIMG='';
function drawVar(){
  const two=!!$('#f_o2').value.trim();
  $('#vars').innerHTML=VARS.length?`<div style="overflow-x:auto"><table class="vt" style="border-collapse:collapse;font-size:13px"><tr class="mu"><td>${esc($('#f_o1').value||'1. seçenek')}</td>${two?`<td>${esc($('#f_o2').value)}</td>`:''}<td>Fiyat ₺</td><td>Stok</td><td>Aktif</td><td>Foto</td><td></td></tr>`+
    VARS.map((v,i)=>`<tr><td><input value="${esc(v.name)}" oninput="VARS[${i}].name=this.value" style="width:58px;padding:6px"></td>
      ${two?`<td><input list="olculer" value="${esc(v.opt2||'')}" oninput="VARS[${i}].opt2=this.value" style="width:58px;padding:6px"></td>`:''}
      <td><input type="number" min="0" step="0.01" value="${v.price}" placeholder="aynı" oninput="VARS[${i}].price=this.value" style="width:58px;padding:6px"></td>
      <td><input type="number" min="0" step="1" value="${v.stock}" oninput="VARS[${i}].stock=this.value" style="width:44px;padding:6px"></td>
      <td><input type="checkbox" ${v.is_active?'checked':''} onchange="VARS[${i}].is_active=this.checked"></td>
      <td><label style="cursor:pointer;margin:0" title="Bu seçeneğe özel fotoğraf">📷${(v.images||[]).length||''}<input type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" multiple style="display:none" onchange="upVarPics(${i},this.files)"></label>${(v.images||[]).length?` <a href="#" onclick="VARS[${i}].images=[];drawVar();return false" class="mu" title="Fotoğrafları kaldır">✕</a>`:''}</td>
      <td><button class="sm" onclick="rmVar(${i})" title="Seçeneği sil">🗑</button></td></tr>`).join('')+'</table></div>'
    :'<p class="mu" style="margin:4px 0">Seçenek yok, ürün tek seçenekli satılır.</p>';
}
// Mousepad ölçüleri: yazmak yerine işaretle, her ölçünün fiyatı ve stoğu ayrı
const SIZES=['90x40','70x30'];
function catMode(){
  const mp=$('#f_cat').value==='mousepad';
  $('#f_sizes').style.display=mp?'':'none';$('#f_varbox').style.display=mp?'none':'';$('#f_ps').style.display=mp?'none':'';
  if(mp){$('#f_o1').value='Ölçü';$('#f_o2').value='';drawSizes();}
}
function drawSizes(){
  $('#f_sizes').innerHTML=`<div class="b" style="margin-bottom:4px">Ölçüler</div>
  <div class="mu" style="margin-bottom:8px">Satacağın ölçüleri işaretle, her birinin fiyatını ve stoğunu yaz. Stok 0 olursa sitede "Tükendi" görünür.</div>
  <table class="vt" style="border-collapse:collapse;font-size:14px"><tr class="mu"><td></td><td>Ölçü</td><td>Fiyat ₺</td><td>Stok</td></tr>`+
  SIZES.map(z=>{const i=VARS.findIndex(v=>v.name===z),v=VARS[i];
    return `<tr><td><input type="checkbox" style="width:auto" ${v?'checked':''} onchange="togSize('${z}',this.checked)"></td><td class="b" style="padding:0 10px">${z} cm</td>
    <td>${v?`<input type="number" min="0" step="0.01" value="${v.price}" oninput="VARS[${i}].price=this.value" style="width:80px;padding:6px">`:'<span class="mu">—</span>'}</td>
    <td>${v?`<input type="number" min="0" step="1" value="${v.stock}" oninput="VARS[${i}].stock=this.value" style="width:60px;padding:6px">`:'<span class="mu">—</span>'}</td></tr>`}).join('')+'</table>';
}
function togSize(z,on){
  const i=VARS.findIndex(v=>v.name===z);
  if(on&&i<0)VARS.push({name:z,opt2:'',price:'',stock:0,images:[],is_active:true});
  if(!on&&i>=0){if(VARS[i].id)VDEL.push(VARS[i].id);VARS.splice(i,1);}
  VARS.sort((a,b)=>SIZES.indexOf(a.name)-SIZES.indexOf(b.name));drawSizes();
}
function rmVar(i){if(VARS[i].id)VDEL.push(VARS[i].id);VARS.splice(i,1);drawVar();}
function genVar(){
  let a=$('#g1').value.split(',').map(x=>x.trim()).filter(Boolean),b=$('#g2').value.split(',').map(x=>x.trim()).filter(Boolean);
  // Sadece ölçü yazıldıysa (renk yok): ölçüler tek seçenek olur
  if(!a.length&&b.length){a=b;b=[];$('#f_o1').value=$('#f_o1').value.trim()||$('#f_o2').value.trim()||'Ölçü';$('#f_o2').value='';}
  if(!a.length)return toast('En az bir değer yaz');
  if(b.length&&!$('#f_o2').value.trim())$('#f_o2').value='Ölçü';
  if(!$('#f_o1').value.trim())$('#f_o1').value='Renk';
  for(const x of a)for(const y of (b.length?b:[null]))if(!VARS.some(v=>v.name===x&&(v.opt2||null)===y))VARS.push({name:x,opt2:y||'',price:'',stock:0,images:[],is_active:true});
  drawVar();
}
async function upVarPics(i,files){
  for(const f of [...files]){
    if(!okImg(f)){toast(f.name+': sadece JPG, PNG, WEBP, HEIC');continue;}
    toast('Yükleniyor...');
    let blob,ext;try{const g=await fromHeic(f);blob=await shrink(g);ext=blob.type==='image/webp'?'webp':(g.type.split('/')[1]);}catch(e){toast(f.name+': '+e.message);continue;}
    const path=`urun/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error}=await sb.storage.from('product-images').upload(path,blob,{contentType:blob.type||f.type,cacheControl:'31536000'});
    if(error){toast('Yüklenemedi: '+error.message);continue;}
    (VARS[i].images=VARS[i].images||[]).push(sb.storage.from('product-images').getPublicUrl(path).data.publicUrl);
  }
  drawVar();toast('Fotoğraf eklendi');
}
function drawVids(){
  $('#vids').innerHTML=VIDS.length?VIDS.map((u,i)=>`<div class="pic"><video src="${esc(u)}" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover"></video><span class="k">▶ Video</span>
    <div class="bt"><button title="Sola al" onclick="mvVid(${i},-1)" ${i===0?'disabled':''}>‹</button><button title="Kaldır" onclick="rmVid(${i})">✕</button><button title="Sağa al" onclick="mvVid(${i},1)" ${i===VIDS.length-1?'disabled':''}>›</button></div></div>`).join('')
    :'<span class="mu">Henüz video yok.</span>';
}
function mvVid(i,d){const j=i+d;if(j<0||j>=VIDS.length)return;[VIDS[i],VIDS[j]]=[VIDS[j],VIDS[i]];drawVids();}
function rmVid(i){VIDS.splice(i,1);drawVids();}
async function upVids(files){
  files=[...files];if(!files.length)return;
  if(VIDS.length+files.length>3)return toast('En fazla 3 video');
  for(let i=0;i<files.length;i++){
    const f=files[i];
    if(!/^video\/(mp4|webm|quicktime)$/.test(f.type)){toast(f.name+': sadece MP4, WEBM veya MOV');continue;}
    if(f.size>50*1024*1024){toast(f.name+': 50 MB\'tan büyük. Videoyu kısalt veya sıkıştır.');continue;}
    $('#vupst').textContent=`Yükleniyor ${i+1}/${files.length} (${Math.round(f.size/1048576)} MB)...`;
    const ext=f.type==='video/quicktime'?'mov':f.type.split('/')[1];
    const path=`video/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error}=await sb.storage.from('product-images').upload(path,f,{contentType:f.type,cacheControl:'31536000'});
    if(error){toast('Yüklenemedi: '+error.message);continue;}
    VIDS.push(sb.storage.from('product-images').getPublicUrl(path).data.publicUrl);drawVids();
  }
  $('#vupst').textContent='';$('#f_vfiles').value='';
}
function drawPics(){
  $('#pics').innerHTML=IMGS.length?IMGS.map((u,i)=>`<div class="pic"><img src="${esc(u)}" alt="">${i===0?'<span class="k">Kapak</span>':''}
    <div class="bt"><button title="Sola al" onclick="mvPic(${i},-1)" ${i===0?'disabled':''}>‹</button><button title="Kaldır" onclick="rmPic(${i})">✕</button><button title="Sağa al" onclick="mvPic(${i},1)" ${i===IMGS.length-1?'disabled':''}>›</button></div></div>`).join('')
    :'<span class="mu">Henüz fotoğraf yok.</span>';
}
function drawGPic(){
  $('#gpic').innerHTML=GIMG?`<div class="pic"><img src="${esc(GIMG)}" alt=""><span class="k">Google</span><div class="bt"><button title="Kaldır" onclick="GIMG='';drawGPic()">✕</button></div></div>`
    :'<span class="mu">Henüz beyaz görsel yok.</span>';
}
async function upGPic(files){
  const f=[...files][0];if(!f)return;
  if(!okImg(f))return toast('Sadece JPG, PNG, WEBP, HEIC');
  $('#gupst').textContent='Yükleniyor...';
  let blob,ext;try{const g=await fromHeic(f);blob=await shrink(g);ext=blob.type==='image/webp'?'webp':(g.type.split('/')[1]);}catch(e){$('#gupst').textContent='';return toast(f.name+': '+e.message);}
  const path=`urun/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await sb.storage.from('product-images').upload(path,blob,{contentType:blob.type||f.type,cacheControl:'31536000'});
  $('#gupst').textContent='';$('#f_gfile').value='';
  if(error)return toast('Yüklenemedi: '+error.message);
  GIMG=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;drawGPic();
}
function mvPic(i,d){const j=i+d;if(j<0||j>=IMGS.length)return;[IMGS[i],IMGS[j]]=[IMGS[j],IMGS[i]];drawPics();}
function rmPic(i){IMGS.splice(i,1);drawPics();}
function addUrl(){const u=$('#f_url').value.trim();if(!u.startsWith('https://'))return toast('Adres https:// ile başlamalı');if(IMGS.length>=10)return toast('En fazla 10 fotoğraf');IMGS.push(u);$('#f_url').value='';drawPics();}
// iPhone HEIC fotoğrafları: tarayıcı açamadığı için önce JPG'ye çevrilir
const isHeic=f=>/^image\/hei[cf]$/.test(f.type)||/\.hei[cf]$/i.test(f.name||'');
const okImg=f=>/^image\/(jpeg|png|webp)$/.test(f.type)||isHeic(f);
let _heic;
function heicLib(){return _heic||(_heic=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';sc.onload=()=>res(window.heic2any);sc.onerror=()=>{_heic=null;rej(new Error('HEIC dönüştürücü yüklenemedi'))};document.head.appendChild(sc);}));}
async function fromHeic(f){
  if(!isHeic(f))return f;
  const conv=await heicLib();let b=await conv({blob:f,toType:'image/jpeg',quality:0.92});if(Array.isArray(b))b=b[0];
  return new File([b],(f.name||'foto').replace(/\.hei[cf]$/i,'')+'.jpg',{type:'image/jpeg'});
}
// Fotoğrafı yüklemeden önce küçült (en uzun kenar 1600px, webp) — site hızlı açılsın
function shrink(file){return new Promise(res=>{const im=new Image();im.onload=()=>{const m=1600,r=Math.min(1,m/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  c.toBlob(b=>res(b||file),'image/webp',0.85);URL.revokeObjectURL(im.src);};im.onerror=()=>res(file);im.src=URL.createObjectURL(file);});}
async function upPics(files){
  files=[...files];if(!files.length)return;
  if(IMGS.length+files.length>10)return toast('En fazla 10 fotoğraf');
  for(let i=0;i<files.length;i++){
    const f=files[i];if(!okImg(f)){toast(f.name+': sadece JPG, PNG, WEBP, HEIC');continue;}
    $('#upst').textContent=`Yükleniyor ${i+1}/${files.length}...`;
    let blob,ext;try{const g=await fromHeic(f);blob=await shrink(g);ext=blob.type==='image/webp'?'webp':(g.type.split('/')[1]);}catch(e){toast(f.name+': '+e.message);continue;}
    const path=`urun/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error}=await sb.storage.from('product-images').upload(path,blob,{contentType:blob.type||f.type,cacheControl:'31536000'});
    if(error){toast('Yüklenemedi: '+error.message);continue;}
    IMGS.push(sb.storage.from('product-images').getPublicUrl(path).data.publicUrl);drawPics();
  }
  $('#upst').textContent='';$('#f_files').value='';
}
async function saveP(id){
  const r={name:$('#f_name').value.trim(),category:$('#f_cat').value,type_label:$('#f_type').value.trim(),
    price:parseFloat($('#f_price').value),stock:parseInt($('#f_stock').value,10),
    description:$('#f_desc').value.trim()||null,images:IMGS,videos:VIDS,image_url:IMGS[0]||null,google_image:GIMG||null,series:$('#f_series').value||null,icon:$('#f_icon').value.trim()||null,is_active:$('#f_act').checked};
  if(r.category==='mousepad'){
    if(!VARS.length)return toast('En az bir ölçü işaretle');
    if(VARS.some(v=>String(v.price).trim()===''||isNaN(parseFloat(v.price))))return toast('Her ölçünün fiyatını yaz');
    VARS.forEach(v=>v.is_active=true);
    r.price=Math.min(...VARS.map(v=>parseFloat(v.price)));r.stock=0;
  }
  if(!r.name||!r.type_label||isNaN(r.price)||isNaN(r.stock))return toast('Ad, tür, fiyat ve stok zorunlu');
  // Seçenekler
  const o1=$('#f_o1').value.trim(),o2=$('#f_o2').value.trim();
  const vs=VARS.map((v,i)=>({id:v.id,product_id:id,name:String(v.name||'').trim(),opt2:o2?(String(v.opt2||'').trim()||null):null,
    price:String(v.price).trim()===''?null:parseFloat(v.price),stock:parseInt(v.stock,10)||0,images:v.images||[],sort:i,is_active:!!v.is_active}));
  if(vs.length){
    if(!o1)return toast('1. seçenek adını yaz (ör. Renk)');
    if(vs.some(v=>!v.name||(o2&&!v.opt2)))return toast('Seçeneklerde boş değer var');
    if(vs.some(v=>v.price!=null&&(isNaN(v.price)||v.price<0)))return toast('Seçenek fiyatı geçersiz');
    const keys=vs.map(v=>v.name.toLocaleLowerCase('tr')+'|'+(v.opt2||'').toLocaleLowerCase('tr'));
    if(new Set(keys).size!==keys.length)return toast('Aynı seçenek iki kez yazılmış');
    r.stock=vs.filter(v=>v.is_active).reduce((s,v)=>s+v.stock,0); // ürün stoğu = seçeneklerin toplamı
  }
  r.option_label=vs.length?o1:null; r.option2_label=vs.length&&o2?o2:null;
  const q=id?sb.from('products').update(r).eq('id',id).select('id').single():sb.from('products').insert(r).select('id').single();
  const {data:pr,error}=await q;
  if(error)return toast('Hata: '+error.message);
  const pid=pr.id;
  if(VDEL.length){const {error:e}=await sb.from('product_variants').delete().in('id',VDEL);if(e)return toast('Seçenek silinemedi: '+e.message);}
  for(const v of vs){
    const row={product_id:pid,name:v.name,opt2:v.opt2,price:v.price,stock:v.stock,images:v.images,sort:v.sort,is_active:v.is_active};
    const {error:e}=v.id?await sb.from('product_variants').update(row).eq('id',v.id):await sb.from('product_variants').insert(row);
    if(e)return toast('Seçenek kaydedilemedi ('+v.name+'): '+e.message);
  }
  $('#dlg').close();toast('Kaydedildi');load();
}

function vSets(){
  $('#view').innerHTML=`<div class="mu" style="margin-bottom:10px">${D.sets.length} set</div>`+
  (D.sets.map(s=>`<div class="card row" style="padding:12px 14px"><div class="b">${esc(s.name)}</div>
    <div class="row"><input id="sp${s.id}" type="number" min="0" step="0.01" value="${s.price}" style="width:120px">
    <button class="sm" onclick="saveS(${s.id})">Fiyatı kaydet</button>
    <button class="sm" onclick="togS(${s.id})"><span class="${s.is_active?'ok':'er'}">${s.is_active?'Aktif':'Pasif'}</span></button></div></div>`).join('')||'<p class="mu">Set yok.</p>');
}
async function saveS(id){
  const v=parseFloat($('#sp'+id).value);if(isNaN(v)||v<0)return toast('Geçersiz fiyat');
  const {error}=await sb.from('sets').update({price:v}).eq('id',id);
  if(error)return toast('Hata: '+error.message);
  D.sets.find(x=>x.id===id).price=v;toast('Kaydedildi');
}
async function togS(id){
  const s=D.sets.find(x=>x.id===id);
  const {error}=await sb.from('sets').update({is_active:!s.is_active}).eq('id',id);
  if(error)return toast('Hata: '+error.message);
  s.is_active=!s.is_active;vSets();
}
boot();
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTs&render=explicit" async defer></script>
